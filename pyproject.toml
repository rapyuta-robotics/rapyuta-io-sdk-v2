[project]
name = "rapyuta-io-sdk-v2"
dynamic = ["version"]
description = "Python SDK for rapyuta.io v2 APIs"
dependencies = [
    "httpx>=0.27.2",
    "pydantic-settings>=2.7.1",
    "python-benedict>=0.30",
    "pyyaml>=6.0.2",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.version]
path = "rapyuta_io_sdk_v2/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rapyuta_io_sdk_v2"]

[dependency-groups]
dev = [
    "coverage>=7.6.1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]


[tool.ruff]
# Keep ALL reproducible; update this pin together with CI and contributor commands.
required-version = "==0.16.9"
extend-exclude = [
    ".agents",
    ".claude",
    ".specify",
    "build",
    "site-packages",
]
force-exclude = true
target-version = "py313"
line-length = 88
indent-width = 4
unsafe-fixes = false

[tool.ruff.lint]
# All stable rules, plus explicit preview checks for function size and nesting.
select = ["ALL", "PLR0914", "PLR0916", "PLR1702"]
preview = true
explicit-preview-rules = true
ignore = [
    # Formatting is enforced by ruff format --check.
    "COM812",
    "COM819",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",
]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-branches = 6
max-returns = 4
max-statements = 30
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
ignore-overlong-task-comments = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
# Pydantic needs model annotations available at runtime.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "rapyuta_io_sdk_v2.models.base.SDKModel",
    "rapyuta_io_sdk_v2.models.utils.BaseObject",
    "rapyuta_io_sdk_v2.models.utils.BaseMetadata",
    "rapyuta_io_sdk_v2.models.utils.BaseList",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.per-file-ignores]
# Tests use assertions and dummy credentials; names describe test intent.
# Tests are an intentional namespace package; examples are executable scripts.
"tests/**/*.py" = ["D100", "D103", "D104", "INP001", "S101", "S105", "S106"]
"examples/**/*.py" = ["INP001", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"
