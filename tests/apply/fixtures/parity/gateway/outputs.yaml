- apiVersion: apiextensions.rapyuta.io/v1
  kind: Package
  metadata:
    name: toxiproxy
    version: synthetic-v1
  spec:
    runtime: device
    device:
      arch: amd64
      restart: always
    executables:
    - name: server
      type: docker
      runAsBash: false
      docker:
        image: quay.io/rapyuta/toxiproxy:synthetic-v1
        imagePullPolicy: IfNotPresent
- apiVersion: apiextensions.rapyuta.io/v1
  kind: Deployment
  metadata:
    name: toxiproxy
    depends:
      kind: package
      nameOrGUID: toxiproxy
      version: synthetic-v1
  spec:
    runtime: device
    device:
      depends:
        kind: device
        nameOrGUID: edge01
    restart: always
    envArgs:
    - name: TOXIPROXY_API_PORT
      value: '8474'
    - name: TOXIPROXY_PROXY_0_NAME
      value: interface
    - name: TOXIPROXY_PROXY_0_LISTEN
      value: 0.0.0.0:15000
    - name: TOXIPROXY_PROXY_0_UPSTREAM
      value: localhost:5000
    - name: TOXIPROXY_PROXY_0_LATENCY
      value: '0'
    - name: TOXIPROXY_PROXY_0_JITTER
      value: '0'
    - name: TOXIPROXY_PROXY_0_BANDWIDTH
      value: '0'
    - name: TOXIPROXY_PROXY_0_TIMEOUT
      value: '0'
    - name: TOXIPROXY_PROXY_0_SLOW_CLOSE
      value: '0'
    - name: TOXIPROXY_PROXY_0_SLICER_AVERAGE_SIZE
      value: '0'
    - name: TOXIPROXY_PROXY_0_SLICER_DELAY
      value: '0'
    - name: TOXIPROXY_PROXY_0_SLICER_SIZE_VARIATION
      value: '0'
