name: ✅ Quality Checks
on: [ push ]

jobs:
  perform-checks:
    name: Perform checks
    runs-on: aks-spot-4cpu
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint code
        uses: astral-sh/ruff-action@v1
        with:
          version: "0.16.9"
          args: "check ."

      - name: Check formatting
        uses: astral-sh/ruff-action@v1
        with:
          version: "0.16.9"
          args: "format --check ."

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          uv sync --locked --python ${{ matrix.python-version }} --all-extras --dev
          uv run --python ${{ matrix.python-version }} python -c "
          import rapyuta_io_sdk_v2
          from rapyuta_io_sdk_v2 import Client, AsyncClient
          from rapyuta_io_sdk_v2.pydantic_source.source import ConfigTreeSource
          print('smoke imports OK')
          "
          uv run --python ${{ matrix.python-version }} pytest tests/ --cov
