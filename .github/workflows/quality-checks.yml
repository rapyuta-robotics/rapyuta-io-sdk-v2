name: ✅ Quality Checks
on: [ push ]

jobs:
  perform-checks:
    name: Perform checks
    runs-on: aks-spot-4cpu
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint code
        uses: astral-sh/ruff-action@v1
        with:
          args: "check"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests
        run: |
          uv sync --python ${{ matrix.python-version }} --all-extras --dev
          uv run --python ${{ matrix.python-version }} python -c "
          import rapyuta_io_sdk_v2
          from rapyuta_io_sdk_v2 import Client, AsyncClient
          from rapyuta_io_sdk_v2.pydantic_source.source import ConfigTreeSource
          print('smoke imports OK')
          "
          uv run --python ${{ matrix.python-version }} pytest tests/ --cov

      - name: Verify core-only imports and resource operations
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/sdk-core
        run: |
          uv sync --python ${{ matrix.python-version }} --no-dev
          uv run --python ${{ matrix.python-version }} --no-dev python -c "
          import importlib.util
          import httpx
          from rapyuta_io_sdk_v2 import Client, AsyncClient, Configuration, Role, Outcome
          from rapyuta_io_sdk_v2.apply import Applier
          from rapyuta_io_sdk_v2.charts import ChartRepository
          from rapyuta_io_sdk_v2.pydantic_source import ConfigTreeSource
          assert importlib.util.find_spec('yaml') is None
          assert importlib.util.find_spec('jinja2') is None
          config = Configuration(load_cli_config=False, features={'apply': True})
          role = Role(metadata={'name': 'reader'}, spec={})
          def respond(request):
              return httpx.Response(200, json=role.model_dump(by_alias=True))
          with httpx.Client(transport=httpx.MockTransport(respond)) as transport:
              with Client(config, transport=transport) as client:
                  assert role.apply(client).outcome == Outcome.CREATED
          print('core-only imports and resource operations OK')
          "
